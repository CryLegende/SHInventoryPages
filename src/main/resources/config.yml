#----------------------------------------------------#
#            SHInventoryPages - Configuration        #
#----------------------------------------------------#
# Pages d'inventaire supplémentaires par joueur, nombre selon la permission shinventorypages.pages.<n>, rangées en
# base de données ; débordement des objets donnés à un joueur à inventaire plein vers ses autres pages ; ramassage
# vers les autres pages quand l'inventaire porté est plein ; historique de toutes les pages pour le staff ; menu des
# pages du joueur (page portée en un clic, icône, nom et réserve de chaque page).
#
# Sélecteur : clic droit = page suivante, clic gauche = page précédente, shift + clic = menu des pages, touche 1 à 9
# au survol = page de ce numéro.
#
# Commandes des joueurs :
#   /pages (alias /page)                          Menu des pages : une case par page, clic gauche pour la porter
#                                                 (shinventorypages.menu) ; clic droit sur une page : son icône,
#                                                 son nom et sa réserve (shinventorypages.menu.customize)
#   /pages <numéro>                               Porte directement cette page (shinventorypages.menu)
#
# Commandes d'administration (racine /shinventorypages, alias /ship) :
#   /shinventorypages reload                      Recharge config.yml et messages.yml (shinventorypages.admin.reload)
#   /shinventorypages saveall                     Écrit les pages de tous les joueurs (shinventorypages.admin.saveall)
#   /shinventorypages info <joueur>               Pages d'un joueur connecté (shinventorypages.admin.info)
#   /shinventorypages recover <fichier> [force]   Réimporte un fichier de unsaved/ (shinventorypages.admin.recover)
#   /shinventorypages history <joueur>            Copies de toutes les pages du joueur (shinventorypages.history) ;
#                                                 avec shinventorypages.history.restore : copie d'un objet,
#                                                 restauration d'une page
# Permissions : shinventorypages.admin (toutes les sous-commandes d'administration), shinventorypages.admin.reload,
#               .saveall, .info et .recover (une chacune), shinventorypages.history,
#               shinventorypages.history.restore, shinventorypages.pages.<n> (nombre de pages, ex.
#               shinventorypages.pages.5) et shinventorypages.pages.* (plafond), shinventorypages.menu et
#               shinventorypages.menu.customize (ouvertes à tous tant qu'elles ne sont pas refusées).
#
# Les messages sont dans messages.yml. Tout est rechargeable par /shinventorypages reload, sauf les sections database et reseau
# (redémarrage). Un fichier invalide annule le rechargement. Couleurs : codes & et &#RRGGBB. Sons : nom (UI_BUTTON_CLICK) ou clé (minecraft:ui.button.click) ;
# "" = aucun son.

# Effet Cécité tant qu'un dialogue de ce plugin est affiché : le texte se lit sur fond noir. Il est retiré dès que le joueur
# tourne la caméra, se déplace ou ouvre un inventaire (le client ne prévient pas le serveur quand il ferme un dialogue).
# Un joueur déjà aveugle pour une autre raison n'est pas touché.
blind-during-dialogs: true

database:
  # "mariadb", "mysql" ou "sqlite"
  type: "mariadb"
  # Fils d'exécution réservés aux lectures et écritures (jamais le thread principal)
  threads: 4
  sqlite:
    # Fichier relatif au dossier du plugin
    file: "player_data.db"
  mysql:
    host: 127.0.0.1
    port: 3306
    database: Opale
    username: utilisateur
    password: 'CHANGE_ME'
    # Propriétés JDBC supplémentaires
    properties: useSSL=false&autoReconnect=true
    # Connexions ouvertes au plus
    pool_size: 4

# Mode réseau. Actif seulement si SHNetwork est installé, que 'actif' vaut true et que la base est MariaDB ou MySQL :
# plusieurs serveurs de jeu partagent alors les pages d'un joueur par la même base (database.mysql, identique sur tous).
# Sans SHNetwork, rien de ceci n'est utilisé. Demande un redémarrage.
#   - À son arrivée, un joueur ne charge ses pages qu'une fois que le serveur de départ a validé les siennes en base
#     et, si HuskSync est installé, que HuskSync lui a appliqué son inventaire porté (la page portée en fait partie).
#   - Chaque chargement prend une version de session dans la table shinventorypages_sync ; une écriture d'un serveur
#     que l'autre a dépassé est refusée et gardée à part dans unsaved/ (fichier .superseded), au lieu d'écraser les pages.
#   - Les copies de secours d'une écriture échouée vont en base (table shinventorypages_unsaved) avant le disque.
reseau:
  actif: true
  # Durée maximale, en secondes, pendant laquelle on attend la confirmation du serveur de départ avant de charger
  # les pages telles que la base les a (serveur de départ arrêté brutalement)
  attente-max-secondes: 10
  # Durée maximale, en secondes, pendant laquelle on attend que HuskSync ait appliqué l'inventaire du joueur ; au-delà
  # le joueur est déconnecté (ses pages ne sont pas chargées), comme quand la base est injoignable
  attente-husksync-secondes: 30

inventory:
  # Emplacement du sélecteur de pages (0-8 : barre d'action, 9-35 : inventaire). Jamais utilisé pour un objet.
  switcher_slot: 17
  # Plafond absolu de pages, quelles que soient les permissions
  max_possible_pages: 10
  # Pages des joueurs sans permission shinventorypages.pages.<nombre>
  default_pages: 1
  # Délai minimal entre deux changements de page d'un joueur (ticks, 20 = 1 s) : anti double-clic
  switch_cooldown_ticks: 4
  # Relecture des permissions de pages des joueurs connectés (secondes, 0 = jamais)
  permission_check_interval: 5
  # Capture de l'inventaire porté de chaque joueur (secondes, 0 = jamais) : copie fraîche de la page courante en
  # mémoire et sélecteur remis s'il a disparu (/clear). Une capture identique n'écrit rien en base.
  capture_interval: 5

# Débordement : un objet donné à un joueur dont l'inventaire porté est plein est rangé dans ses autres pages,
# piles partielles d'abord, puis emplacements vides, page par page. Ce qui ne tient nulle part reste au sol.
# Est donné : un objet qui lui est destiné (/give), un objet tombé du bloc qu'il vient de casser, ou le reste d'un
# don qu'un autre plugin pose à ses pieds (crate, quête, boutique, butin qu'un plugin lui renvoie à ses pieds).
# Jamais : un objet jeté, le butin tombé là où une créature ou un joueur meurt, un distributeur, une explosion,
# une ferme, un piston ou un œuf aux pieds du joueur (règles de ramassage de l'île), un objet posé par un plugin
# de ignored_plugins, ni un objet qu'un plugin marque en le faisant apparaître : les piles de WildStacker (spawners
# empilés, butin des créatures empilées) restent au sol, leur quantité réelle n'est connue que de WildStacker.
# Rien n'est rangé tant que les pages sont figées (monde interdit, parcours).
overflow:
  enabled: true
  # Ramassage vers les pages : un objet au sol que le joueur touche alors que son inventaire porté n'en peut rien
  # prendre (butin d'une créature, objet jeté, pile empilée...) est rangé dans ses autres pages. Les règles de
  # ramassage de l'île et le drapeau item-pickup des régions WorldGuard s'appliquent comme au ramassage normal.
  pickup_into_pages: true
  # Objet destiné à un joueur (/give) : distance (blocs) de ses pieds ou de ses yeux
  capture_radius: 1.5
  # Reste d'un don posé par un plugin : distance horizontale (blocs) aux pieds du joueur
  feet_radius: 0.75
  # Objets posés au sol qui sont des mécaniques du monde ou des décors, jamais des dons : nom d'un plugin (tout le
  # plugin) ou classe/paquet Java (une seule mécanique, le reste du plugin garde ses dons)
  ignored_plugins:
    # Sortie des générateurs ; les générateurs rendus au joueur restent des dons
    - "me.kafein.elitegenerator.feature.DropRouter"
    # Objets de bonus et cookies décoratifs (rendus non ramassables juste après leur apparition)
    - "SHItemsBoosts"
    - "SHCookieClicker"
    # Billets ramassés pour de l'argent
    - "MoneyFromMobs"
  # Objets qui tombent d'un bloc que le joueur vient de casser (minage à distance)
  capture_broken_block_drops: true
  # Autour d'une mort ou d'un distributeur, et d'une explosion (blocs) : objets du monde, jamais rangés
  loot_radius: 3.0
  explosion_radius: 10.0
  # Durée (ticks) pendant laquelle la place d'un objet laissé au ramassage reste réservée s'il n'est pas ramassé
  reservation_ticks: 60
  # Délai minimal entre deux messages de débordement à un même joueur (ticks)
  notice_cooldown_ticks: 60
  sound: "ENTITY_ITEM_PICKUP"
  sound_volume: 0.5
  sound_pitch: 1.5

# Sélecteur de pages. %current_page% et %max_pages% sont remplacés dans le nom et la description.
switcher_item:
  material: "PAPER"
  name: '&bPages d''inventaire &7(&b%current_page%&7/&b%max_pages%&7)'
  # Nom quand le joueur a nommé la page portée (%page_name%)
  name_with_page_name: '&bPages d''inventaire &7(&b%current_page%&7/&b%max_pages%&7) &8· &f%page_name%'
  lore:
    - ""
    - "&7 Débloquez des pages de l'inventaire"
    - "&7 en complétant certaines quêtes."
    - ""
    - "&7Clic droit &8&l» &bPage suivante"
    - "&7Clic gauche &8&l» &bPage précédente"
    - "&7Shift + clic &8&l» &bListe des pages"
    - "&7Touche 1 à 9 &8&l» &bPage de ce numéro"
    - ""
  # Quantité affichée = numéro de la page portée ; sinon fixed_amount
  amount_equals_page: true
  fixed_amount: 1
  # Reflet d'enchantement
  enchant_glow: true

# Menu des pages : /pages, ou shift + clic sur le sélecteur. Une case par page (28 au plus), avec ses emplacements
# occupés et ses objets les plus nombreux ; un clic gauche porte la page. Le menu reste ouvert : l'inventaire du
# joueur, affiché en dessous, devient celui de la page et s'utilise comme devant un coffre. Les textes sont dans
# messages.yml.
menu:
  # false : ni menu ni /pages ; shift + clic sur le sélecteur change alors de page comme un clic simple
  enabled: true
  # Touche 1 à 9 au survol du sélecteur : porte la page de ce numéro
  number_keys: true
  # Pages pas encore débloquées affichées, grisées, jusqu'à inventory.max_possible_pages
  show_locked_pages: true
  # Objets les plus nombreux de chaque page listés dans sa description (0 = aucun)
  preview_items: 3
  # Réglages de chaque page par le joueur (clic droit sur une page) :
  #   - icône : un objet de son inventaire, jamais consommé. Le sélecteur en prend l'apparence quand la page est
  #     portée, tout en restant l'objet de switcher_item.material (rien ne peut le vendre, le fabriquer ou le
  #     compter comme l'objet imité). Un client antérieur à la 1.21.4 voit le sélecteur par défaut.
  #   - nom : saisi dans un dialogue (clients 1.21.6 et plus), affiché sur le sélecteur et dans le menu, tel quel
  #     (pas de codes couleur) ; son joueur est le seul à le voir.
  #   - page réservée : le rangement automatique (débordement, ramassage vers les pages, dons des plugins) la saute
  #     tant qu'elle n'est pas portée.
  customization: true
  # Longueur maximale du nom d'une page (48 au plus)
  name_max_length: 24
  # Version de protocole à partir de laquelle un client reçoit le dialogue du nom (771 = 1.21.6)
  dialog_min_protocol: 771
  materials:
    frame: "BLACK_STAINED_GLASS_PANE"
    filler: "GRAY_STAINED_GLASS_PANE"
    locked_page: "GRAY_DYE"
    # Page dont la ligne en base est illisible (voir /shinventorypages info)
    unreadable_page: "BARRIER"
    name: "NAME_TAG"
    reserved_on: "LIME_DYE"
    reserved_off: "GRAY_DYE"
    reset_icon: "BARRIER"
    back: "PAPER"
  # Volume : sounds.volume ; coupés avec sounds.enabled
  sounds:
    open: "ui.toast.in"
    navigate: "entity.bat.takeoff"
    success: "entity.horse.armor"
    deny: "entity.zombie.break_wooden_door"

# Remplace le sélecteur dans les mondes interdits, pendant un blocage (parcours...) et pendant le chargement
barrier_item:
  material: "BARRIER"
  name: "&cPages d'inventaire"
  lore:
    - ""
    - "&7Vous ne pouvez pas changer"
    - "&7de page dans cette zone."
    - ""

blacklist:
  # Mondes où l'on ne change pas de page
  worlds:
    - "arene"
    - "Revent"

sounds:
  # Coupe tous les sons du plugin
  enabled: true
  switch_page: "UI_BUTTON_CLICK"
  switch_fail: "BLOCK_ANVIL_LAND"
  volume: 0.8
  pitch: 1.2

death:
  # Quand l'inventaire n'est pas gardé (gamerule keepInventory à false et aucun plugin qui le garde) :
  #   CURRENT : la page portée tombe comme un inventaire normal, les autres pages sont gardées.
  #   ALL     : la page portée et toutes les autres pages débloquées tombent (sauf pages figées : monde de la
  #             liste noire, parcours ; elles suivent alors CURRENT).
  #   NONE    : la page portée est gardée (36 emplacements) ; armure et main secondaire tombent.
  drop_mode: "CURRENT"

performance:
  # Sauvegarde automatique de tous les joueurs (secondes, 0 = désactivée). Seules les pages modifiées sont écrites.
  auto_save_interval: 300
  # Après un changement de page qui a modifié la page quittée : écriture en base tout de suite (au plus une par
  # seconde, une rafale de clics est regroupée) ; un simple feuilletage n'écrit rien. false : écriture regroupée
  # (voir deferred_save_ticks)
  save_on_page_switch: true
  # Avec cette écriture, enregistrement du fichier joueur de Minecraft dans le même tick : après un arrêt brutal,
  # l'inventaire porté et les pages en base restent du même moment (sinon un objet passé d'une page à l'autre peut
  # exister deux fois)
  save_player_file_on_page_switch: true
  # Regroupement des écritures après un rangement (ticks)
  deferred_save_ticks: 40
  # Base injoignable à la déconnexion : nouveaux essais pendant ce délai (secondes), puis copie dans
  # plugins/SHInventoryPages/unsaved/ (réimport : /shinventorypages recover <fichier>, joueur hors ligne)
  end_of_session_retry_seconds: 180
  # Attente maximale des écritures à l'arrêt du serveur (secondes) ; au-delà, copie dans unsaved/
  shutdown_save_timeout: 30

placeholders:
  # %shinventorypages_current_page% et %shinventorypages_max_pages%
  enabled: true

# Historique des pages : une copie de toutes les pages d'un joueur (page portée comprise) est gardée en base (table
# shinventorypages_history) aux mêmes moments qu'InventoryRollbackPlus pour l'inventaire porté, et avant toute opération
# sur toutes les pages (vente de toutes les pages, restauration). Une copie dont la seule page remplie est la page
# portée n'est pas gardée (InventoryRollbackPlus l'a déjà), ni une copie identique à la précédente du joueur
# (connexion, déconnexion, périodique). Consultation : /shinventorypages history <joueur>.
history:
  enabled: true
  # Copies gardées par joueur pour chaque moment (les plus récentes) ; 0 = aucune copie à ce moment
  max_copies:
    join: 18
    quit: 18
    death: 18
    periodic: 24
    operation: 18
    restore: 18
  # Copie des joueurs connectés toutes les N minutes (0 = jamais), seulement si leurs pages ont changé
  periodic_minutes: 30
  # Copies plus anciennes supprimées (jours)
  retention_days: 14
  # Date affichée dans les menus
  date_format: "dd/MM/yyyy HH:mm:ss"
  # Objet de chaque copie dans la liste, selon son moment
  icons:
    join: "OAK_DOOR"
    quit: "IRON_DOOR"
    death: "SKELETON_SKULL"
    periodic: "CLOCK"
    operation: "GOLD_INGOT"
    restore: "ENDER_CHEST"
