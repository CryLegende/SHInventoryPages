name: SHInventoryPages
version: '${project.version}'
main: org.Cry_Legende.sHInventoryPages.SHInventoryPages
api-version: '1.21'
author: Cry_Legende
# SHNetwork et HuskSync sont facultatifs : sans eux, rien ne change (serveur seul). Avec eux, les pages se partagent
# entre serveurs (voir la section reseau de config.yml).
softdepend: [PlaceholderAPI, SHNetwork, HuskSync, WorldGuard, ViaVersion]
# Charges par Paper dans le classloader du plugin : HikariCP doit voir le driver MariaDB,
# que le serveur ne fournit pas (il n'embarque que MySQL et SQLite).
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shinventorypages:
    description: Main command for SHInventoryPages.
    usage: /shinventorypages <reload|saveall|info <joueur>|recover <fichier> [force]|history <joueur>>
    aliases: [ship]
  pages:
    description: Opens the inventory pages menu, or wears a page directly.
    usage: /pages [numéro]
    aliases: [page]

permissions:
  shinventorypages.*:
    description: Grants all permissions for SHInventoryPages.
    children:
      shinventorypages.admin: true
      shinventorypages.history: true
      shinventorypages.history.restore: true
      shinventorypages.pages.*: true
      shinventorypages.menu: true
      shinventorypages.menu.customize: true
  shinventorypages.admin:
    description: All the administration subcommands of /shinventorypages.
    default: op
    children:
      shinventorypages.admin.reload: true
      shinventorypages.admin.saveall: true
      shinventorypages.admin.info: true
      shinventorypages.admin.recover: true
  shinventorypages.admin.reload:
    description: Reloads config.yml and messages.yml (/shinventorypages reload).
    default: false
  shinventorypages.admin.saveall:
    description: Writes the pages of every player (/shinventorypages saveall).
    default: false
  shinventorypages.admin.info:
    description: Shows the pages of a player (/shinventorypages info <player>).
    default: false
  shinventorypages.admin.recover:
    description: Re-imports a file of unsaved/ (/shinventorypages recover <file>).
    default: false
  shinventorypages.history:
    description: Opens the page history of a player (/shinventorypages history <player>).
    default: op
  shinventorypages.history.restore:
    description: Copies items out of the page history and restores a page from it.
    default: op
    children:
      shinventorypages.history: true
  shinventorypages.menu:
    description: Opens the pages menu (/pages, shift-click on the switcher) and wears a page directly (/pages <number>).
    default: true
  shinventorypages.menu.customize:
    description: Picks an icon and a name for each page and reserves pages, from the pages menu.
    default: true
  shinventorypages.pages.*:
    description: Wildcard for page amount permissions (e.g., shinventorypages.pages.5).
    default: false # Ne pas donner par défaut
  # shinventorypages.pages.<n> (pages.2 à pages.<max_possible_pages>) est géré dynamiquement, non déclaré : il donne
  # n pages au joueur (exemple : shinventorypages.pages.5).
